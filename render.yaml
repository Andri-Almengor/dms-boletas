services:
  - type: web
    name: dms-boletas
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build && npm ci --prefix backend
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      - key: NODE_ENV
        value: production

      # Persistencia operacional PostgreSQL. Configure en Render la INTERNAL DATABASE URL
      # del recurso dms-boletas-postgres. Nunca guarde la URL real en Git.
      - key: DATABASE_URL
        sync: false
      - key: PG_POOL_MAX
        value: "3"
      - key: PG_IDLE_TIMEOUT_MS
        value: "30000"
      - key: PG_CONNECTION_TIMEOUT_MS
        value: "8000"
      - key: PG_STATEMENT_TIMEOUT_MS
        value: "60000"
      - key: PG_SLOW_QUERY_MS
        value: "1000"

      # Sincronización incremental PostgreSQL <-> IndexedDB.
      - key: INCREMENTAL_SYNC_ENABLED
        value: "true"
      - key: SYNC_SCHEMA_VERSION
        value: "2"

      # Google permanece para Drive, Docs y spreadsheets/reportes generados.
      # GOOGLE_SHEET_ID ya no forma parte de la persistencia operacional.
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY
        sync: false

      - key: MEMORY_BUDGET_MB
        value: "512"
      - key: HTTP_MAX_CONCURRENT_REQUESTS
        value: "6"
      - key: HTTP_MAX_CONCURRENT_LARGE_REQUESTS
        value: "1"
      - key: HTTP_QUEUE_LIMIT
        value: "12"
      - key: AI_ACTION_MAX_CONCURRENT
        value: "2"
      - key: GEMINI_TIMEOUT_MS
        value: "65000"
      - key: GEMINI_TOTAL_TIMEOUT_MS
        value: "210000"
      - key: GEMINI_MAX_RETRIES
        value: "1"
      - key: SESSION_HOURS
        value: "12"
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: APP_PUBLIC_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GOOGLE_CHAT_WEBHOOK
        sync: false
      - key: MAINTENANCE_FINALIZATION_WAKE_SECRET
        sync: false
