name: Render PostgreSQL Stage 3

on:
  workflow_dispatch:
  push:
    branches:
      - feat/migrate-sheets-to-render-postgres
    paths:
      - .github/workflows/render-postgres-stage3.yml

permissions:
  contents: read

jobs:
  import-and-verify:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
      PG_SSL_MODE: verify-full
      PG_POOL_MAX: 3
      PG_IDLE_TIMEOUT_MS: 30000
      PG_CONNECTION_TIMEOUT_MS: 8000
      STAGE3_SOURCE_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-c0c4-81f5-8162-630581cfb0a6/raw?se=2026-09-17T22%3A16%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=57510ff2-cfed-5c25-8352-837b6b37b4e0&skoid=77636ecc-ad8d-44df-baa7-163b524a0261&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T18%3A21%3A36Z&ske=2026-09-18T18%3A21%3A36Z&sks=b&skv=2026-02-06&sig=0nUA3VqtVA6m/pqTfBS7nvBxQs1BjaTSJmZqxaI4cMA%3D'
      STAGE3_SOURCE_SHA: 20c811d40231e7c2627fedeb32fcd748056aa77c0ebf5db037e360951e694512
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Require Stage 3 inputs
        shell: bash
        run: |
          test -n "${DATABASE_URL:-}" || { echo "::error::RENDER_DATABASE_URL is missing"; exit 1; }
          test -n "${STAGE3_SOURCE_URL:-}" || { echo "::error::Encrypted Stage 3 source URL is missing"; exit 1; }

      - name: Download encrypted workbook
        shell: bash
        run: |
          curl --fail --silent --show-error --location "$STAGE3_SOURCE_URL" --output /tmp/source.xlsx.enc
          echo 'bfa04593751c52859b672348c7359fd638381f3c65b817223e593f6b87efbabb  /tmp/source.xlsx.enc' | sha256sum --check --strict

      - name: Decrypt and verify workbook
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const encrypted = fs.readFileSync('/tmp/source.xlsx.enc');
          if (encrypted.subarray(0, 8).toString() !== 'DMS3ENC1') throw new Error('Invalid Stage 3 encrypted source header');
          const peerPublic = encrypted.subarray(8, 41);
          const salt = encrypted.subarray(41, 57);
          const iv = encrypted.subarray(57, 69);
          const tag = encrypted.subarray(69, 85);
          const ciphertext = encrypted.subarray(85);
          const secret = process.env.DATABASE_URL || '';
          if (!secret) throw new Error('Missing DATABASE_URL');
          let seed = crypto.createHash('sha256').update('dms-boletas-stage3-transport-v1\0').update(secret).digest();
          const ecdh = crypto.createECDH('secp256k1');
          let counter = 0;
          while (true) {
            try { ecdh.setPrivateKey(seed); break; }
            catch { counter += 1; seed = crypto.createHash('sha256').update(seed).update(String(counter)).digest(); }
          }
          const shared = ecdh.computeSecret(peerPublic);
          const key = Buffer.from(crypto.hkdfSync('sha256', shared, salt, Buffer.from('dms-boletas-stage3-xlsx-v1'), 32));
          const decipher = crypto.createDecipheriv('aes-256-gcm', key, iv);
          decipher.setAuthTag(tag);
          const plain = Buffer.concat([decipher.update(ciphertext), decipher.final()]);
          const sha = crypto.createHash('sha256').update(plain).digest('hex');
          if (sha !== process.env.STAGE3_SOURCE_SHA) throw new Error(`Unexpected workbook SHA-256: ${sha}`);
          fs.writeFileSync('/tmp/DMS_WebApp_DB.xlsx', plain, { mode: 0o600 });
          console.log(JSON.stringify({ step: 'source-integrity', ok: true, bytes: plain.length, sha256: sha }));
          NODE
          rm -f /tmp/source.xlsx.enc

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Syntax-check Stage 3 tooling
        shell: bash
        run: |
          node --check backend/src/scripts/db-stage3-analyze.js
          node --check backend/src/scripts/db-stage3-preflight.js
          node --check backend/src/scripts/db-stage3-verify.js

      - name: Confirm Stage 2 migrations
        run: npm --prefix backend run db:status

      - name: Reconfirm source analysis
        run: npm --prefix backend run db:import:xlsx -- --file /tmp/DMS_WebApp_DB.xlsx --dry-run

      - name: Confirm anomaly classification
        run: npm --prefix backend run db:stage3:analyze -- --file /tmp/DMS_WebApp_DB.xlsx

      - name: Require empty operational database before first import
        run: npm --prefix backend run db:stage3:preflight -- --source-sha "$STAGE3_SOURCE_SHA"

      - name: Apply XLSX migration transaction
        run: npm --prefix backend run db:import:xlsx -- --file /tmp/DMS_WebApp_DB.xlsx --apply

      - name: Verify source and canonical checksums
        run: npm --prefix backend run db:verify -- --file /tmp/DMS_WebApp_DB.xlsx

      - name: Verify Stage 3 reconciliation and sequence continuity
        run: npm --prefix backend run db:stage3:verify -- --file /tmp/DMS_WebApp_DB.xlsx

      - name: Reverify Stage 2 structure after import
        run: npm --prefix backend run db:stage2:verify

      - name: Verify XLSX import idempotence
        run: npm --prefix backend run db:import:xlsx -- --file /tmp/DMS_WebApp_DB.xlsx --apply

      - name: Remove decrypted workbook
        if: always()
        shell: bash
        run: rm -f /tmp/DMS_WebApp_DB.xlsx /tmp/source.xlsx.enc
