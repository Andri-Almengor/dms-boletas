name: Apply offline catalog stage 1

on:
  push:
    branches:
      - feature/offline-first-stage-1-catalog-sync

permissions:
  contents: write

concurrency:
  group: offline-catalog-stage-1
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/offline-first-stage-1-catalog-sync
          fetch-depth: 0

      - name: Apply targeted patch
        run: python scripts/apply-offline-catalog-stage1.py

      - name: Verify focused tests and syntax
        run: |
          node --check src/services/moduleApi.js
          node --check src/services/offlineStoreCore.js
          node --test tests/characterization/offline-catalog-sync.test.mjs

      - name: Commit final implementation
        shell: bash
        run: |
          rm -f scripts/apply-offline-catalog-stage1.py
          rm -f .github/workflows/apply-offline-catalog-stage1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Implementar cola offline para catálogos de mantenimiento"
          git push origin HEAD:feature/offline-first-stage-1-catalog-sync
