name: Apply ticket detail fixes

on:
  push:
    branches:
      - fix/remove-technician-dropdown-arrow

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-technician-dropdown-arrow
          fetch-depth: 0

      - name: Apply deterministic evidence reset and dark signature styles
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          detail_path = Path('src/pages/tickets/TicketDetailPage.jsx')
          detail = detail_path.read_text(encoding='utf-8')

          old_state = "  const [evidenceForm, setEvidenceForm] = useState({ name: '', note: '', file: null });\n  const [signatureEditorOpen, setSignatureEditorOpen] = useState(false);"
          new_state = "  const [evidenceForm, setEvidenceForm] = useState({ name: '', note: '', file: null });\n  const [evidenceInputVersion, setEvidenceInputVersion] = useState(0);\n  const [signatureEditorOpen, setSignatureEditorOpen] = useState(false);"
          assert old_state in detail, 'No se encontró el estado del formulario de evidencias'
          detail = detail.replace(old_state, new_state, 1)

          old_before_upload = "  async function uploadEvidence(event) {\n    event.preventDefault();\n    const formElement = event.currentTarget;"
          new_before_upload = "  function clearEvidenceForm() {\n    setEvidenceForm({ name: '', note: '', file: null });\n    setEvidenceInputVersion((current) => current + 1);\n    if (cameraInputRef.current) cameraInputRef.current.value = '';\n    if (fileInputRef.current) fileInputRef.current.value = '';\n  }\n\n  async function uploadEvidence(event) {\n    event.preventDefault();"
          assert old_before_upload in detail, 'No se encontró el inicio de uploadEvidence'
          detail = detail.replace(old_before_upload, new_before_upload, 1)

          old_reset = "      setEvidenceForm({ name: '', note: '', file: null });\n      formElement?.reset();\n      if (cameraInputRef.current) cameraInputRef.current.value = '';\n      if (fileInputRef.current) fileInputRef.current.value = '';"
          assert old_reset in detail, 'No se encontró la limpieza anterior de evidencias'
          detail = detail.replace(old_reset, "      clearEvidenceForm();", 1)

          old_camera = "                ref={cameraInputRef}\n                className=\"ticket-detail-hidden-input\""
          new_camera = "                key={`camera-${evidenceInputVersion}`}\n                ref={cameraInputRef}\n                className=\"ticket-detail-hidden-input\""
          assert old_camera in detail, 'No se encontró el input de cámara'
          detail = detail.replace(old_camera, new_camera, 1)

          old_file = "                ref={fileInputRef}\n                className=\"ticket-detail-hidden-input\""
          new_file = "                key={`file-${evidenceInputVersion}`}\n                ref={fileInputRef}\n                className=\"ticket-detail-hidden-input\""
          assert old_file in detail, 'No se encontró el input de archivo'
          detail = detail.replace(old_file, new_file, 1)
          detail_path.write_text(detail, encoding='utf-8')

          dark_path = Path('src/styles/theme-dark-coverage.css')
          dark = dark_path.read_text(encoding='utf-8')
          old_dark = "/* El lienzo de firma permanece blanco para conservar el trazo negro legible. */\n:root[data-theme='dark'] .signature-pad canvas {\n  background: repeating-linear-gradient(0deg, #fff 0, #fff 37px, #eee 38px) !important;\n}"
          new_dark = "/* La firma se presenta oscura sin alterar el PNG original que se guarda.\n * El filtro afecta solo la visualización: el canvas continúa exportando el\n * trazo negro original para documentos y PDF. */\n:root[data-theme='dark'] .signature-pad canvas,\n:root[data-theme='dark'] .signature-display img {\n  filter: invert(1) hue-rotate(180deg);\n}\n\n:root[data-theme='dark'] .signature-pad canvas {\n  background: repeating-linear-gradient(0deg, #fff 0, #fff 37px, #eee 38px) !important;\n}\n\n:root[data-theme='dark'] .signature-display {\n  background: var(--dark-surface-soft) !important;\n}"
          assert old_dark in dark, 'No se encontró la regla oscura anterior de firma'
          dark = dark.replace(old_dark, new_dark, 1)
          dark_path.write_text(dark, encoding='utf-8')

          test_path = Path('tests/characterization/ux-performance-feedback.test.mjs')
          tests = test_path.read_text(encoding='utf-8')
          marker = "test('el detalle limpia la evidencia y adapta la firma al modo oscuro'"
          if marker not in tests:
              tests += """

          test('el detalle limpia la evidencia y adapta la firma al modo oscuro', () => {
            const detail = source('src/pages/tickets/TicketDetailPage.jsx');
            const darkStyles = source('src/styles/theme-dark-coverage.css');

            assert.match(detail, /const \[evidenceInputVersion, setEvidenceInputVersion\] = useState\(0\)/);
            assert.match(detail, /function clearEvidenceForm\(\)/);
            assert.match(detail, /setEvidenceInputVersion\(\(current\) => current \+ 1\)/);
            assert.match(detail, /key=\{`camera-\$\{evidenceInputVersion\}`\}/);
            assert.match(detail, /key=\{`file-\$\{evidenceInputVersion\}`\}/);
            assert.match(detail, /clearEvidenceForm\(\);/);
            assert.doesNotMatch(detail, /formElement\?\.reset\(\)/);

            assert.match(darkStyles, /signature-pad canvas,\s*\n:root\[data-theme='dark'\] \.signature-display img/);
            assert.match(darkStyles, /filter: invert\(1\) hue-rotate\(180deg\)/);
            assert.match(darkStyles, /La firma se presenta oscura sin alterar el PNG original/);
          });
          """
          test_path.write_text(tests, encoding='utf-8')

          Path('.github/workflows/temp-ticket-detail-fixes.yml').unlink()
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/tickets/TicketDetailPage.jsx src/styles/theme-dark-coverage.css tests/characterization/ux-performance-feedback.test.mjs .github/workflows/temp-ticket-detail-fixes.yml
          git commit -m "fix: limpiar evidencias y adaptar firma oscura"
          git push origin HEAD:fix/remove-technician-dropdown-arrow
