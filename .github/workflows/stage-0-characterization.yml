name: Stage 0 Characterization

on:
  pull_request:
  push:
    branches:
      - main
      - 'refactor/**'

permissions:
  contents: read

concurrency:
  group: stage-0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Verify characterization and baseline
        run: npm run verify:stage0

      - name: Upload refactor baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refactor-baseline-${{ github.sha }}
          path: .artifacts/refactor-baseline.json
          if-no-files-found: ignore
          retention-days: 30
