name: Stage 0 Characterization

on:
  pull_request:
  push:
    branches:
      - main
      - 'refactor/**'
      - 'perf/**'

permissions:
  contents: read

concurrency:
  group: stage-0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dms_boletas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dms_boletas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dms_boletas_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dms_boletas_test
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ci@example.invalid
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ci-placeholder
      INCREMENTAL_SYNC_ENABLED: 'true'
      SYNC_SCHEMA_VERSION: '2'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Apply PostgreSQL migrations
        run: npm --prefix backend run db:migrate

      - name: Verify characterization and baseline
        run: npm run verify:stage0

      - name: Upload refactor baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refactor-baseline-${{ github.sha }}
          path: .artifacts/refactor-baseline.json
          if-no-files-found: ignore
          retention-days: 30
