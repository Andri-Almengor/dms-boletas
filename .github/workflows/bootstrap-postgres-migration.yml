name: Bootstrap PostgreSQL migration sources

on:
  push:
    branches:
      - feat/migrate-sheets-to-render-postgres

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/migrate-sheets-to-render-postgres
          fetch-depth: 0
      - name: Verify and expand prepared migration worktree
        run: |
          cat .migration-bootstrap/part-* | base64 -d > /tmp/dms-pg-work.tar.gz
          echo 'c9db7edeb79ac0ca1a29a0202f22321d2cbaa6faa92a4507850f1337d5402eb6  /tmp/dms-pg-work.tar.gz' | sha256sum -c -
          tar -xzf /tmp/dms-pg-work.tar.gz -C .
          rm -rf .migration-bootstrap
          rm -f .github/workflows/bootstrap-postgres-migration.yml
      - name: Commit migration implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: migrate operational persistence to PostgreSQL'
          git push origin HEAD:feat/migrate-sheets-to-render-postgres
