name: Stage 1 PostgreSQL validation

on:
  push:
    branches:
      - feat/migrate-sheets-to-render-postgres
    paths:
      - '.github/workflows/bootstrap-postgres-migration.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/migrate-sheets-to-render-postgres
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Verify PostgreSQL migration dependencies
        run: npm ls pg exceljs --prefix backend
      - name: Check modified JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"
          mapfile -t files < <(git diff --name-only "$base"...HEAD -- 'backend/**/*.js' 'backend/**/*.mjs' | sort -u)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            echo "node --check $file"
            node --check "$file"
          done
      - name: Run non-database backend checks
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://stage1:stage1@127.0.0.1:1/stage1
        run: npm run check --prefix backend
      - name: Verify lockfile is stable
        run: |
          npm install --package-lock-only --ignore-scripts --prefix backend
          git diff --exit-code -- backend/package.json backend/package-lock.json
