name: Render PostgreSQL Cutover Transport Key

on:
  push:
    branches:
      - feat/migrate-sheets-to-render-postgres
    paths:
      - .github/workflows/render-postgres-cutover-key.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derive-key:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
    steps:
      - name: Require Render database secret
        shell: bash
        run: test -n "${DATABASE_URL:-}" || { echo "::error::RENDER_DATABASE_URL is missing"; exit 1; }

      - name: Derive ephemeral transport public key
        shell: bash
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const secret = process.env.DATABASE_URL || '';
          if (!secret) throw new Error('Missing DATABASE_URL');
          let seed = crypto.createHash('sha256')
            .update('dms-boletas-stage3-transport-v1\0')
            .update(secret)
            .digest();
          const ecdh = crypto.createECDH('secp256k1');
          let counter = 0;
          while (true) {
            try { ecdh.setPrivateKey(seed); break; }
            catch {
              counter += 1;
              seed = crypto.createHash('sha256').update(seed).update(String(counter)).digest();
            }
          }
          console.log('CUTOVER_TRANSPORT_PUBLIC_KEY=' + ecdh.getPublicKey('hex', 'compressed'));
          NODE
