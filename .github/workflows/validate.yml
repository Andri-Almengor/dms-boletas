name: Validate application

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dms_boletas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dms_boletas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dms_boletas_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dms_boletas_test
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ci@example.invalid
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ci-placeholder
      INCREMENTAL_SYNC_ENABLED: 'true'
      SYNC_SCHEMA_VERSION: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Generate audited lockfile candidates (temporary)
        # Executed only in disposable CI; candidates are reviewed and committed
        # separately, then this temporary step is removed before final approval.
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts
          npm --prefix backend install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
          npm --prefix backend audit fix --package-lock-only --ignore-scripts || true
          mkdir -p .artifacts
          cp package-lock.json .artifacts/npm-lockfile-frontend.candidate.json
          cp backend/package-lock.json .artifacts/npm-lockfile-backend.candidate.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: PostgreSQL status before migrations
        run: npm --prefix backend run db:status
      - name: Apply PostgreSQL migrations
        run: npm --prefix backend run db:migrate
      - name: PostgreSQL status after migrations
        run: npm --prefix backend run db:status
      - name: Re-apply PostgreSQL migrations idempotently
        run: npm --prefix backend run db:migrate
      - name: Verify PostgreSQL stage 2 structure and transactions
        run: npm --prefix backend run db:stage2:verify
      - name: PostgreSQL integration and migration tests
        run: npm --prefix backend run test:db
      - name: PostgreSQL representative query benchmark
        run: |
          mkdir -p .artifacts
          npm --prefix backend run db:benchmark > .artifacts/postgres-benchmark.json
      - name: Run characterization tests
        run: npm run test:characterization
      - name: Build frontend
        run: npm run build
      - name: Check backend syntax and unit tests
        run: |
          find backend/src -name '*.js' -print0 | xargs -0 -n1 node --check
          npm run check:backend
      - name: Record all npm advisories (production and development)
        shell: bash
        run: |
          mkdir -p .artifacts
          npm audit --json > .artifacts/npm-audit-frontend-all.json || true
          npm --prefix backend audit --json > .artifacts/npm-audit-backend-all.json || true
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          for (const name of ['frontend', 'backend']) {
            const report = JSON.parse(readFileSync(`.artifacts/npm-audit-${name}-all.json`, 'utf8'));
            if (report.error || !report.metadata?.vulnerabilities) {
              throw new Error(`npm audit report unavailable: ${name}`);
            }
            console.log(JSON.stringify({ ecosystem: name, vulnerabilities: report.metadata.vulnerabilities }));
          }
          NODE
      - name: Audit production dependencies
        run: npm run audit:security
      - name: Collect final metrics and validation
        run: |
          npm run baseline
          npm run report:final
          node scripts/low-memory-smoke.mjs > .artifacts/low-memory-smoke.json
          npm run test:stress
          npm run verify:final
          node scripts/benchmark-critical-ticket-routes.mjs
          node scripts/benchmark-critical-ticket-pending.mjs
          git diff --check
      - name: Upload final validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-validation
          path: .artifacts/
          if-no-files-found: error
          include-hidden-files: true
