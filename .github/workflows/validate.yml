name: Validate application

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-offline-stage:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply dependency-aware offline catalogs
        run: python scripts/apply-offline-catalog-stage.py

      - name: Verify focused offline tests
        run: node --test tests/characterization/offline-catalog-sync.test.mjs

      - name: Commit final clean branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show origin/main:.github/workflows/validate.yml > .github/workflows/validate.yml
          rm -f scripts/apply-offline-catalog-stage.py
          git add -A
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Integrar catálogos offline con dependencias"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Build frontend
        run: npm run build

      - name: Check backend syntax
        run: |
          find backend/src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Audit production dependencies
        run: npm run audit:security

      - name: Collect final metrics and CSS audit
        run: |
          npm run baseline
          npm run report:final

      - name: Upload final validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-validation
          path: .artifacts/
          if-no-files-found: error
          include-hidden-files: true
