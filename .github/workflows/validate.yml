name: Validate application

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Run characterization tests
        run: npm run test:characterization

      - name: Build frontend
        run: npm run build

      - name: Check backend syntax
        run: |
          find backend/src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Audit production dependencies
        run: npm run audit:security

      - name: Collect final metrics and CSS audit
        run: |
          npm run baseline
          npm run report:final
          node scripts/low-memory-smoke.mjs > .artifacts/low-memory-smoke.json

      - name: Run final PR validation
        run: |
          npm run test:characterization
          npm run check:backend
          npm run build
          npm run baseline
          npm run verify:stage0
          npm run audit:security
          npm run report:final
          npm run test:stress
          npm run verify:final
          node scripts/benchmark-critical-ticket-routes.mjs
          node scripts/benchmark-critical-ticket-pending.mjs
          git diff --check

      - name: Upload final validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-validation
          path: .artifacts/
          if-no-files-found: error
          include-hidden-files: true
