name: Validate application

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Run characterization tests
        run: npm run test:characterization

      - name: Build frontend
        run: npm run build

      - name: Check backend syntax
        run: |
          find backend/src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check gateway agent syntax
        run: npm --prefix gateway-agent run check

      - name: Audit production dependencies
        run: npm run audit:security

      - name: Collect final metrics and CSS audit
        run: |
          npm run baseline
          npm run report:final

      - name: Upload final validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-validation
          path: .artifacts/
          if-no-files-found: error
          include-hidden-files: true
