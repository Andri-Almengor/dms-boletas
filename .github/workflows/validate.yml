name: Validate application

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dms_boletas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dms_boletas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dms_boletas_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dms_boletas_test
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ci@example.invalid
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ci-placeholder
      INCREMENTAL_SYNC_ENABLED: 'true'
      SYNC_SCHEMA_VERSION: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install frontend dependencies
        run: npm install
      - name: Install backend dependencies
        run: npm install --prefix backend
      - name: Apply PostgreSQL migrations
        run: npm --prefix backend run db:migrate
      - name: PostgreSQL integration and migration tests
        run: npm --prefix backend run test:db
      - name: PostgreSQL representative query benchmark
        run: |
          mkdir -p .artifacts
          npm --prefix backend run db:benchmark > .artifacts/postgres-benchmark.json
      - name: Run characterization tests
        run: npm run test:characterization
      - name: Build frontend
        run: npm run build
      - name: Check backend syntax and unit tests
        run: |
          find backend/src -name '*.js' -print0 | xargs -0 -n1 node --check
          npm run check:backend
      - name: Audit production dependencies
        run: npm run audit:security
      - name: Collect final metrics and validation
        run: |
          npm run baseline
          npm run report:final
          node scripts/low-memory-smoke.mjs > .artifacts/low-memory-smoke.json
          npm run test:stress
          npm run verify:final
          node scripts/benchmark-critical-ticket-routes.mjs
          node scripts/benchmark-critical-ticket-pending.mjs
          git diff --check
      - name: Upload final validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-validation
          path: .artifacts/
          if-no-files-found: error
          include-hidden-files: true
